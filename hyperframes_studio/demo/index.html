<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Placeholders: replace all three with the film's own palette and display face. */
      :root {
        --ground: #1b0f2e;
        --ink: #ffffff;
        --accent: #ff7a3d;
        --font-display: sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
      }
      #title {
        color: var(--ink);
        font-size: 100px;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-align: center;
        line-height: 1.05;
      }
      #title span { color: var(--accent); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="3" data-track-index="0">HyperFrames<br><span>listo</span></h1>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { y: 60, scale: 0.92 }, { y: 0, scale: 1, duration: 0.9, ease: "power4.out" }, 0);
      tl.to("#title", { scale: 1.06, duration: 2.0, ease: "sine.inOut" }, 1.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
